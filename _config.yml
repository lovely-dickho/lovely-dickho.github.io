title: "lovely_dickho"
description: "Philosophy, Mathematics, and Economics"
url: "https://lovely-dickho.github.io"
baseurl: ""

# 원격 테마 적용
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# 프로필 설정
author:
  name: "서재영 (Jae Young Seo)"
  avatar: "https://github.com/lovely-dickho.png"
  bio: "Philosophy, Mathematics, and Economics"

# 마크다운 및 플러그인 설정
markdown: kramdown
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

paginate: 5
paginate_path: /page:num/

# 일반 포스트 기본 레이아웃 및 수식(MathJax) 활성화
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      mathjax: true
      author_profile: true